name: release

# Publishes on a version tag once a Trusted Publisher is bound on npmjs.com.
# npm verifies this repository and workflow through GitHub's OIDC token, so no
# token or OTP is involved. Bind it under package settings before the first run:
# npmjs.com -> pi-refuseless -> Settings -> Trusted Publisher -> GitHub Actions
# (workflow filename: release.yml, allowed action: direct publish).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package version $version" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
